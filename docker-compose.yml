# Sobe o app com HTTPS automático (Caddy + Let's Encrypt).
# Antes: copie .env.example para .env e preencha DOMAIN e SETUP_KEY.
services:
  arvore:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      COOKIE_SECURE: "1"
    volumes:
      - ./data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./livros-caddy:/etc/caddy/livros:ro
      - caddy_data:/data
    depends_on:
      - arvore
volumes:
  caddy_data:
